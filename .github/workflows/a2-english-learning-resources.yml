name: A2 English learning resources
on:
  push:
    branches: [main]
    paths:
      - "a2-english-learning-resources/**"
      - ".github/workflows/a2-english-learning-resources.yml"
  pull_request:
    paths:
      - "a2-english-learning-resources/**"
      - ".github/workflows/a2-english-learning-resources.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt -r a2-english-learning-resources/requirements.txt
      - run: python -m pytest -q a2-english-learning-resources/tests
      - run: git diff --exit-code
